<style>
/* Layout: workbench. Left = editor with tabs, right = A4 paper preview on a muted desk. Paper is always white and ATS-plain. */
:root{
  --bg:#E8ECE9; --surface:#F7F9F7; --field:#FFFFFF; --ink:#15201C; --muted:#5A6A64; --line:#C9D2CD;
  --accent:#0E6A5A; --accent-ink:#FFFFFF; --accent-soft:#D5EBE5;
  --warn:#8A5200; --warn-bg:#FFEFD0; --bad:#A3281F; --bad-bg:#FCE3E0; --good:#1B6636; --good-bg:#DAF1E1; --info:#3B5B73; --info-bg:#E2EDF5;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1513; --surface:#161F1B; --field:#1C2722; --ink:#E5EEEA; --muted:#98A9A2; --line:#2B3933;
    --accent:#4FC3A8; --accent-ink:#06201A; --accent-soft:#1B3A33;
    --warn:#F0B454; --warn-bg:#392B10; --bad:#FF9188; --bad-bg:#3A1714; --good:#72D694; --good-bg:#14301F; --info:#8DB8D6; --info-bg:#173040;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:var(--font-display);margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.inp{width:100%;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit}
textarea.inp{resize:vertical;min-height:38px;overflow:hidden}
.lbl{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 11px;border-radius:6px;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--ink);border-color:var(--line)}
.btn-danger{color:var(--bad);border-color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:500;line-height:1.6}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.mono{font-family:var(--font-mono)}
.tab{padding:8px 12px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.sec-title{font-size:15px;font-weight:700}
.hint{font-size:12.5px;color:var(--muted)}
.mono{font-family:var(--font-mono)}
.status{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:6px;font-size:13px}
.status.pass{background:var(--good-bg);color:var(--good)}
.status.warn{background:var(--warn-bg);color:var(--warn)}
.status.fail{background:var(--bad-bg);color:var(--bad)}
.status.info{background:var(--info-bg);color:var(--info)}
.status b{font-weight:600}
.meter{height:10px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.meter>i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.meter>u{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);opacity:.5;text-decoration:none}
.zone{position:absolute;top:0;bottom:0;background:var(--accent-soft)}

/* ---------- A4 paper (ATS-safe: one column, web-safe font, no icons/photos/skill bars) ---------- */
.desk{padding:18px 0}
.pv-wrap{position:relative;margin:0 auto;overflow:hidden}
.paper{font-family:Arial,Helvetica,sans-serif;font-size:12.5px;line-height:1.42;color:#111;background:#fff;width:794px;min-height:1123px;padding:42px 48px;box-sizing:border-box;box-shadow:0 1px 3px rgba(0,0,0,.25),0 12px 30px rgba(0,0,0,.12);transform-origin:top left}
.paper.compact{font-size:11.5px;line-height:1.36;padding:34px 44px}
.paper h1{font-family:Arial,Helvetica,sans-serif;font-size:25px;line-height:1.15;margin:0;font-weight:700;letter-spacing:.2px}
.paper .headline{font-size:13.5px;margin-top:3px;font-weight:600}
.paper .contact{margin-top:4px;font-size:11.5px}
.paper h2{font-family:Arial,Helvetica,sans-serif;font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;border-bottom:1px solid #111;margin:14px 0 6px;padding-bottom:2px;font-weight:700}
.paper .row{display:flex;justify-content:space-between;gap:12px;font-weight:700;margin-top:6px}
.paper .row:first-of-type{margin-top:0}
.paper .row span.r{font-weight:400;white-space:nowrap}
.paper .sub{font-style:italic;margin-top:0}
.paper ul{margin:3px 0 0;padding-left:17px;list-style:disc}
.paper li{margin:1px 0}
.paper p{margin:0}
.paper .ph{background:#FFE08A;color:#111;border-radius:2px}
.paper .letter p{margin:0 0 10px;text-align:justify;text-justify:inter-word}
.paper .letter .gap{height:10px}
#printRoot{display:none}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff !important}
  body>*:not(#printRoot){display:none !important}
  #printRoot{display:block !important}
  #printRoot .paper{box-shadow:none;transform:none !important;width:100%;min-height:0}
  .paper .ph{background:none}
}
</style>
</head>

const LS_KEY = 'cvforge.v1';
const PAGE_H = 1123;
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

let db = { cvs: [] };
let ui = { view: 'list', cvId: null, tab: 'content', doc: 'cv', pane: 'edit', xyzPath: null, xyz: { x: '', y: '', z: '' }, confirmDel: null, saveState: 'idle', storageOk: true };
let lastPageH = 0;

/* ---------- persistence ---------- */
function load() {
  try { const r = localStorage.getItem(LS_KEY); if (r) { const p = JSON.parse(r); if (p && Array.isArray(p.cvs)) db = p; } } catch (e) { ui.storageOk = false; }
  if (!db.cvs.length) {
    db.cvs = SEED.map((c, i) => ({ ...JSON.parse(JSON.stringify(c)), id: uid(), updatedAt: Date.now() - i * 1000 }));
    save(true);
  }
}
let saveTimer = null;
function save(now) {
  const run = () => {
    try { localStorage.setItem(LS_KEY, JSON.stringify(db)); ui.saveState = 'saved'; ui.storageOk = true; }
    catch (e) { ui.saveState = 'nostore'; ui.storageOk = false; }
    paintSave();
  };
  ui.saveState = 'saving'; paintSave();
  clearTimeout(saveTimer);
  if (now) run(); else saveTimer = setTimeout(run, 300);
}
function paintSave() {
  const el = $('#saveState'); if (!el) return;
  const m = { idle: '', saving: 'Menyimpan…', saved: 'Tersimpan di browser', nostore: 'Penyimpanan browser diblokir. Pakai Ekspor JSON.' };
  el.textContent = m[ui.saveState] || '';
  el.style.color = ui.saveState === 'nostore' ? 'var(--bad)' : 'var(--muted)';
}
function toast(msg) {
  const t = $('#toast');
  t.innerHTML = `<div class="card" style="padding:8px 12px;box-shadow:0 6px 20px rgba(0,0,0,.2)">${esc(msg)}</div>`;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.innerHTML = ''; }, 2600);
}

/* ---------- model helpers ---------- */
const cur = () => db.cvs.find(c => c.id === ui.cvId);
const getPath = (o, p) => p.split('.').reduce((a, k) => a == null ? a : a[isNaN(k) ? k : +k], o);
function setPath(o, p, v) {
  const k = p.split('.'); let a = o;
  for (let i = 0; i < k.length - 1; i++) a = a[isNaN(k[i]) ? k[i] : +k[i]];
  const last = k[k.length - 1]; a[isNaN(last) ? last : +last] = v;
}
const blankExp = () => ({ id: uid(), role: '', org: '', location: '', start: '', end: '', bullets: [''] });
const blankProj = () => ({ id: uid(), name: '', link: '', stack: '', bullets: [''] });
const blankEdu = () => ({ id: uid(), school: '', degree: '', start: '', end: '', gpa: '', details: '' });
const blankSkill = () => ({ id: uid(), group: '', items: '' });
const blankCert = () => ({ id: uid(), name: '', issuer: '', year: '' });
function blankCV(base) {
  const b = base ? JSON.parse(JSON.stringify(base.basics)) : { name: '', headline: '', email: '', phone: '', location: '', links: [] };
  return {
    id: uid(), name: 'CV baru', updatedAt: Date.now(),
    target: { title: '', company: '', url: '', jd: '' },
    template: { fresh: base ? !!base.template.fresh : true, compact: false },
    basics: b, summary: '', experience: [], projects: [],
    education: base ? JSON.parse(JSON.stringify(base.education)) : [blankEdu()],
    skills: base ? JSON.parse(JSON.stringify(base.skills)) : [blankSkill()], certs: [],
    cover: { recipient: '', recipientTitle: '', company: '', hook: '', body: '', closing: 'Thank you for your time and consideration. I would welcome the chance to discuss how I can contribute.' }
  };
}
function normalize(c) {
  const d = blankCV(); const o = { ...d, ...c };
  o.target = { ...d.target, ...(c.target || {}) }; o.template = { ...d.template, ...(c.template || {}) };
  o.basics = { ...d.basics, ...(c.basics || {}) }; o.cover = { ...d.cover, ...(c.cover || {}) };
  ['experience', 'projects', 'education', 'skills', 'certs'].forEach(k => { o[k] = Array.isArray(c[k]) ? c[k] : []; });
  o.basics.links = Array.isArray(o.basics.links) ? o.basics.links : [];
  o.id = o.id || uid(); o.updatedAt = o.updatedAt || Date.now();
  return o;
}
const touch = () => { const c = cur(); if (c) { c.updatedAt = Date.now(); save(); } };

/* ---------- text helpers ---------- */
const words = s => (String(s || '').trim().match(/\S+/g) || []).length;
const PH_RE = /\[[^\]]*\]/g;
const phCount = s => (String(s || '').match(PH_RE) || []).length;
const ph = s => esc(s).replace(/\[[^\]]*\]/g, m => `<mark class="ph">${m}</mark>`);
const WEAK_RE = /^\s*(responsible for|helped|worked on|involved in|in charge of|duties (included|include)|tasked with)/i;
const dates = (a, b) => (a && b) ? `${a} – ${b}` : (a || b || '');
function allBullets(cv) {
  const out = [];
  cv.experience.forEach((e, i) => e.bullets.forEach((t, j) => out.push({ path: `experience.${i}.bullets.${j}`, text: t })));
  cv.projects.forEach((e, i) => e.bullets.forEach((t, j) => out.push({ path: `projects.${i}.bullets.${j}`, text: t })));
  return out;
}
function bulletFlags(t) {
  const s = String(t || '').trim(); const f = [];
  if (!s) return f;
  if (!/\d/.test(s)) f.push(['warn', 'Belum ada angka']);
  if (WEAK_RE.test(s)) f.push(['warn', 'Pembuka lemah']);
  if (phCount(s)) f.push(['bad', 'Isi [..]']);
  if (s.length > 230) f.push(['info', 'Terlalu panjang']);
  return f;
}
const chips = f => f.map(([k, l]) => `<span class="chip ${k}">${esc(l)}</span>`).join(' ');

function kwPanelHTML(cv) {
  const k = analyzeKeywords(cv);
  if (!k) return `<div class="status info"><span class="mono">i</span><div><b>Belum ada deskripsi lowongan</b><div>Tempel isi lowongan di atas. Kamu akan melihat keyword mana yang sudah cocok dan mana yang belum.</div></div></div>`;
  const pct = Math.round(k.coverage * 100);
  const zone = pct < 50 ? ['warn', 'Masih rendah'] : (k.stuffed.length ? ['warn', 'Ada keyword terlalu sering diulang'] : (pct > 85 ? ['good', 'Sangat cocok, pastikan ada buktinya'] : ['good', 'Zona sehat (moderat)']));
  return `<div class="flex justify-between items-baseline gap-2 flex-wrap"><b style="font-size:15px">Kecocokan keyword: ${pct}%</b><span class="chip ${zone[0]}">${zone[1]}</span></div>
    <div class="meter" style="margin:8px 0 4px" aria-hidden="true"><span class="zone" style="left:50%;width:35%"></span><i style="width:${pct}%"></i></div>
    <div class="hint">Area hijau muda adalah zona moderat (50 sampai 85%). Skor tinggi baik asal tiap keyword ada buktinya; riset menunjukkan CV yang menjejalkan keyword paling banyak justru 21% lebih jarang dipanggil.</div>
    <div style="margin-top:12px"><span class="lbl">Sudah ada di CV (${k.matched.length})</span><div class="flex gap-1 flex-wrap">${k.matched.map(i => `<span class="chip good">${esc(i.label)}${i.cvHits >= 7 ? ' ×' + i.cvHits : ''}</span>`).join('') || '<span class="hint">Belum ada.</span>'}</div></div>
    <div style="margin-top:10px"><span class="lbl">Belum ada (${k.missing.length})</span><div class="flex gap-1 flex-wrap">${k.missing.map(i => `<span class="chip warn">${esc(i.label)}</span>`).join('') || '<span class="hint">Semua tercakup.</span>'}</div>
    <div class="hint" style="margin-top:6px">Tambahkan hanya yang benar-benar pernah kamu kerjakan (langkah 3: cek setiap saran).</div></div>
    ${k.stuffed.length ? `<div class="status warn" style="margin-top:10px"><span class="mono">!</span><div><b>Diulang terlalu sering:</b> ${k.stuffed.map(i => esc(i.label)).join(', ')}. Sebutkan sekali di tempat yang paling kuat.</div></div>` : ''}`;
}

    return `<article class="card" style="padding:14px;display:flex;flex-direction:column;gap:10px">
      <div><h3 style="font-size:17px;line-height:1.25">${esc(c.name)}</h3><div class="hint">${esc(c.target.title || 'Tanpa target')}${c.target.company ? ' @ ' + esc(c.target.company) : ''}</div></div>
      <div><div class="flex justify-between hint"><span>Checklist</span><span class="mono">${sc.ok}/${sc.total}</span></div><div class="meter" style="margin-top:4px"><i style="width:${Math.round(pct * 100)}%"></i></div></div>

    `<main style="max-width:1100px;margin:0 auto;padding:22px 16px 60px"><div class="flex items-end justify-between gap-3 flex-wrap" style="margin-bottom:14px"><div><h2 style="font-size:26px;letter-spacing:-.01em">CV kamu</h2><div class="hint">${db.cvs.length} CV tersimpan di browser ini. ${ui.storageOk ? '' : '<b style="color:var(--bad)">Penyimpanan browser diblokir, ekspor JSON agar tidak hilang.</b>'}</div></div></div>

function applyGrid() { const wb = $('#workbench'); if (wb) wb.style.gridTemplateColumns = window.innerWidth >= 1024 ? 'minmax(0,540px) minmax(0,1fr)' : 'minmax(0,1fr)'; }
function afterEditorRender() {

function autosize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight + 2, 420) + 'px'; }

/* ---------- preview + insights ---------- */
function fitPreview() {
  $$('.pv-wrap').forEach(w => {
    const p = w.firstElementChild; if (!p) return;
    const avail = Math.max(280, ($('#deskScroll') ? $('#deskScroll').clientWidth : 794) - 4);
    const k = Math.min(1, avail / 794);
    p.style.transform = `scale(${k})`; w.style.width = Math.round(794 * k) + 'px'; w.style.height = Math.round(p.offsetHeight * k) + 'px';
  });
}
function refreshPreview() {
  const cv = cur(); if (!cv) return;
  const a = $('#pvCV'), b = $('#pvCL'); if (!a || !b) return;
  a.innerHTML = cvHTML(cv); b.innerHTML = letterHTML(cv);
  a.style.display = ui.doc === 'cv' ? '' : 'none'; b.style.display = ui.doc === 'cl' ? '' : 'none';
  $('#measure').innerHTML = cvHTML(cv); lastPageH = $('#measure').firstElementChild.offsetHeight;
  $('#printRoot').innerHTML = ui.doc === 'cv' ? cvHTML(cv) : letterHTML(cv);
  fitPreview();
}
function refreshInsights() {
  const cv = cur(); if (!cv) return;
  allBullets(cv).forEach(b => { const el = document.querySelector(`[data-badge="${b.path}"]`); if (el) el.innerHTML = chips(bulletFlags(b.text)); });
  const kp = $('#kwPanel'); if (kp) kp.innerHTML = kwPanelHTML(cv);
  const cl = $('#clPanel'); if (cl) cl.innerHTML = computeCoverChecks(cv).map(statusHTML).join('');
  const cp = $('#checkPanel'); const ch = computeChecks(cv); if (cp) cp.innerHTML = ch.map(statusHTML).join('');
  const sc = score(ch); const pill = $('#scorePill'); if (pill) { pill.textContent = `Checklist ${sc.ok}/${sc.total}`; pill.className = `chip ${sc.ok === sc.total ? 'good' : 'warn'} mono`; }
  const s = $('#sumCount'); if (s) s.textContent = `${words(cv.summary)} kata`;
}
function rerenderEditor(focusPath) {
  const cv = cur(); $('#editor').innerHTML = editorHTML(cv); afterEditorRender(); refreshPreview(); refreshInsights();
  if (focusPath) { const el = document.getElementById(idOf(focusPath)); if (el) el.focus(); }

/* ---------- file helpers ---------- */
function download(name, text, type) {
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
  catch (e) { toast('Unduhan diblokir di tampilan ini. Buka file ini langsung di browser.'); }
}
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch (e) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); toast(okMsg); } catch (_) { toast('Gagal menyalin. Blok teks secara manual.'); } t.remove(); }
}
const slug = s => String(s || 'cv').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'cv';

/* ---------- events ---------- */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.xyz) { ui.xyz[t.dataset.xyz] = t.value; return; }
  const p = t.dataset && t.dataset.path; if (!p) return;
  const cv = cur(); if (!cv) return;
  setPath(cv, p, t.value);
  if (t.tagName === 'TEXTAREA') autosize(t);
  touch(); refreshPreview(); refreshInsights();
});
document.addEventListener('change', e => {
  const t = e.target; const cv = cur();
  if (t.dataset && t.dataset.bool && cv) { setPath(cv, t.dataset.bool, t.checked); touch(); rerenderEditor(); }
  if (t.id === 'importFile' && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const d = JSON.parse(fr.result); const arr = Array.isArray(d) ? d : (d.cvs || [d]);
        arr.forEach(c => { const n = normalize(c); n.id = uid(); db.cvs.push(n); });
        save(true); render(); toast(`${arr.length} CV diimpor`);
      } catch (err) { toast('File JSON tidak valid'); }
    };
    fr.readAsText(t.files[0]); t.value = '';
  }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]'); if (!b) return;
  const a = b.dataset.action; const cv = cur(); const p = b.dataset.path;
  const arrOf = path => { const k = path.split('.'); const idx = +k.pop(); return [getPath(cv, k.join('.')), idx]; };
  switch (a) {
    case 'open': ui.cvId = b.dataset.id; ui.view = 'edit'; ui.tab = 'content'; ui.doc = 'cv'; ui.pane = 'edit'; ui.confirmDel = null; render(); break;
    case 'back': ui.view = 'list'; ui.cvId = null; render(); break;
    case 'new': { const base = [...db.cvs].sort((x, y) => y.updatedAt - x.updatedAt)[0]; const n = blankCV(base); db.cvs.push(n); save(true); ui.cvId = n.id; ui.view = 'edit'; ui.tab = 'content'; render(); toast('CV baru dibuat. Data diri disalin dari CV terakhir.'); break; }
    case 'dup': { const src = db.cvs.find(c => c.id === b.dataset.id); const n = JSON.parse(JSON.stringify(src)); n.id = uid(); n.name = src.name + ' (salinan)'; n.updatedAt = Date.now(); n.target = { title: '', company: '', url: '', jd: '' }; n.cover.recipient = ''; n.cover.company = ''; db.cvs.push(n); save(true); ui.cvId = n.id; ui.view = 'edit'; ui.tab = 'target'; render(); toast('Disalin. Isi lowongan baru, lalu sesuaikan bullet.'); break; }
    case 'del': if (ui.confirmDel === b.dataset.id) { db.cvs = db.cvs.filter(c => c.id !== b.dataset.id); ui.confirmDel = null; save(true); renderList(); toast('CV dihapus'); } else { ui.confirmDel = b.dataset.id; renderList(); clearTimeout(ui._cd); ui._cd = setTimeout(() => { ui.confirmDel = null; if (ui.view === 'list') renderList(); }, 3500); } break;
    case 'tab': ui.tab = b.dataset.tab; if (ui.tab === 'cover') ui.doc = 'cl'; if (ui.tab === 'content') ui.doc = 'cv'; ui.xyzPath = null; render(); break;
    case 'doc': ui.doc = b.dataset.doc; refreshPreview(); $$('[data-action="doc"]').forEach(x => x.classList.toggle('btn-primary', x.dataset.doc === ui.doc)); break;
    case 'pane': ui.pane = b.dataset.pane; renderEdit(); break;
    case 'add': { const lists = { experience: blankExp, projects: blankProj, education: blankEdu, skills: blankSkill, certs: blankCert, 'basics.links': () => ({ label: '', url: '' }) }; const arr = getPath(cv, p); arr.push(lists[p]()); touch(); rerenderEditor(); break; }
    case 'rm': { const [arr, i] = arrOf(p); arr.splice(i, 1); touch(); rerenderEditor(); break; }
    case 'mv': { const [arr, i] = arrOf(p); const j = i + +b.dataset.dir; if (j >= 0 && j < arr.length) { [arr[i], arr[j]] = [arr[j], arr[i]]; touch(); rerenderEditor(); } break; }
    case 'add-bullet': { const arr = getPath(cv, p); arr.push(''); touch(); rerenderEditor(`${p}.${arr.length - 1}`); break; }
    case 'rm-bullet': { const [arr, i] = arrOf(p); arr.splice(i, 1); if (!arr.length) arr.push(''); ui.xyzPath = null; touch(); rerenderEditor(); break; }
    case 'xyz': ui.xyzPath = ui.xyzPath === p ? null : p; ui.xyz = { x: '', y: '', z: '' }; rerenderEditor(ui.xyzPath ? null : null); if (ui.xyzPath) { const x = $('#xyz_x'); if (x) x.focus(); } break;
    case 'xyz-apply': { const { x, y, z } = ui.xyz; const txt = [x.trim(), y.trim(), z.trim()].filter(Boolean).join(' '); if (!txt) { toast('Isi minimal satu kolom XYZ'); break; } setPath(cv, p, txt); ui.xyzPath = null; touch(); rerenderEditor(p); break; }
    case 'print': refreshPreview(); window.print(); break;
    case 'copy-text': copyText(ui.doc === 'cv' ? cvText(cv) : letterText(cv), ui.doc === 'cv' ? 'CV disalin sebagai teks polos' : 'Cover letter disalin'); break;
    case 'export-one': download(`cv-${slug(cv.name)}.json`, JSON.stringify([cv], null, 2), 'application/json'); break;
    case 'export-all': download('cv-forge-backup.json', JSON.stringify(db.cvs, null, 2), 'application/json'); break;
    case 'import': $('#importFile').click(); break;
  }
});
window.addEventListener('resize', () => { applyGrid(); fitPreview(); });
window.addEventListener('beforeprint', () => { if (ui.view === 'edit') refreshPreview(); });

function render() { ui.view === 'list' ? renderList() : renderEdit(); window.scrollTo(0, 0); }
load();
render();
</script>
</body>
</html>
